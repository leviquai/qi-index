limit_req_zone $binary_remote_addr zone=api:10m rate=200r/m;
limit_req_zone $binary_remote_addr zone=ws:10m rate=10r/m;

proxy_cache_path /var/cache/nginx
    levels=1:2
    keys_zone=qi_cache:10m
    max_size=500m
    inactive=60s
    use_temp_path=off;

server {
    listen 80;

    gzip on;
    gzip_types application/json application/yaml text/plain;

    location /ws {
        limit_req zone=ws burst=5 nodelay;

        proxy_pass         http://qi-index:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    location /openapi.yaml {
        proxy_pass        http://qi-index:8080;
        proxy_cache       qi_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_lock  on;
        add_header        X-Cache-Status $upstream_cache_status;
    }

    location ~ ^/(tip|stats)$ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass        http://qi-index:8080;
        proxy_cache       qi_cache;
        proxy_cache_valid 200 5s;
        proxy_cache_lock  on;
        add_header        X-Cache-Status $upstream_cache_status;
    }

    location / {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://qi-index:8080;
    }
}
