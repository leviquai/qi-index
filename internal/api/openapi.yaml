openapi: 3.1.0
info:
  title: qi-index API
  version: 0.1.0
  description: >
    REST and WebSocket API for the Qi UTXO ledger on Quai Network.
    All hex values are 0x-prefixed strings. All integer amounts are
    decimal strings (to avoid 64-bit overflow in JSON parsers).
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: chain
    description: Chain tip and block-level data
  - name: address
    description: Address-scoped UTXO queries
  - name: utxo
    description: Individual outpoint lookups
  - name: batch
    description: Batch endpoints for wallet sync
  - name: stats
    description: Aggregate indexer statistics

paths:
  /tip:
    get:
      tags: [chain]
      summary: Current indexed chain tip
      responses:
        '200':
          description: Tip block
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipBlock'
        '404':
          $ref: '#/components/responses/NotFound'

  /block/{height}/utxos:
    get:
      tags: [chain]
      summary: All UTXO state changes at a block height
      parameters:
        - $ref: '#/components/parameters/Height'
      responses:
        '200':
          description: Created, spent, and trimmed UTXOs at this height
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockUTXOEvents'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /tx/{txhash}:
    get:
      tags: [utxo]
      summary: All UTXOs created and spent by a transaction
      parameters:
        - $ref: '#/components/parameters/TxHash'
      responses:
        '200':
          description: UTXOs created and spent by this tx
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TxUTXOs'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /utxo/{txhash}/{index}:
    get:
      tags: [utxo]
      summary: Single outpoint lookup
      parameters:
        - $ref: '#/components/parameters/TxHash'
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: UTXO row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UTXO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /address/{addr}/utxos:
    get:
      tags: [address]
      summary: Unspent UTXOs for an address
      parameters:
        - $ref: '#/components/parameters/Address'
      responses:
        '200':
          description: Unspent UTXO list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UTXO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /address/{addr}/balance:
    get:
      tags: [address]
      summary: Spendable, locked, and trimmed balance for an address
      parameters:
        - $ref: '#/components/parameters/Address'
      responses:
        '200':
          description: Balance summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /address/{addr}/history:
    get:
      tags: [address]
      summary: Paginated full UTXO history for an address
      parameters:
        - $ref: '#/components/parameters/Address'
        - name: before
          in: query
          required: false
          description: Cursor from a previous response's next_cursor field
          schema:
            type: string
            example: "9902346:00110084c5e9effec91cc019df102bc856b28a644a7a4f72d1c7971e2172296d:2"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Paginated UTXO history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /outpoints:
    post:
      tags: [batch]
      summary: Batch unspent outpoints for a list of addresses
      description: >
        Returns unspent outpoints in the same shape as the node's
        quai_getOutpointsByAddress RPC. A quais.js wallet can use qi-index
        as a drop-in provider by pointing it at this endpoint — see
        examples/quaisjs-provider.js.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addresses]
              properties:
                addresses:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 1000
                  example: ["0x00f84b86f0b62e40f58d97a33547e5c7bb3da936"]
      responses:
        '200':
          description: Map of address to outpoint list
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/NodeOutpoint'
              example:
                "0x00f84b86f0b62e40f58d97a33547e5c7bb3da936":
                  - txHash: "0x002400bed298d410b8a57c13bd6135f25e974a8626ad02a250a7f7adde9c8817"
                    index: "0x0"
                    denomination: "0x6"
                    lock: "0x9ac848"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /stats:
    get:
      tags: [stats]
      summary: Aggregate UTXO set statistics
      responses:
        '200':
          description: Indexer statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '500':
          $ref: '#/components/responses/InternalError'

  /ws:
    get:
      tags: [chain]
      summary: WebSocket — live block UTXO events
      description: >
        Upgrade to WebSocket. The server pushes a BlockUTXOEvents JSON object
        after each block is indexed. The connection is kept alive with
        ping/pong frames every 50 seconds.
      responses:
        '101':
          description: WebSocket upgrade

components:
  parameters:
    Address:
      name: addr
      in: path
      required: true
      schema:
        type: string
        pattern: '^0x[0-9a-fA-F]{40}$'
      example: "0x00f84b86f0b62e40f58d97a33547e5c7bb3da936"

    TxHash:
      name: txhash
      in: path
      required: true
      schema:
        type: string
        pattern: '^(0x)?[0-9a-fA-F]{64}$'
      example: "0x00110084c5e9effec91cc019df102bc856b28a644a7a4f72d1c7971e2172296d"

    Height:
      name: height
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
      example: 9902792

  schemas:
    TipBlock:
      type: object
      properties:
        height:
          type: integer
        hash:
          type: string
        parent_hash:
          type: string
        timestamp:
          type: integer
          description: Unix seconds; 0 for blocks indexed before migration 004
        exchange_rate:
          type: string
          description: Hex-encoded big.Int; empty string when absent

    UTXO:
      type: object
      properties:
        tx_hash:
          type: string
        tx_index:
          type: integer
        address:
          type: string
        denomination:
          type: integer
        value:
          type: string
          description: Decimal qit value for this denomination
        lock_height:
          type: integer
          description: 0 = spendable; non-zero = unlock block height
        source:
          type: integer
          description: "0=qi_tx 1=coinbase_etx 2=conversion_etx"
        created_block:
          type: integer
        state:
          type: string
          enum: [unspent, spent, trimmed]
        spent_block:
          type: integer
        spent_tx:
          type: string
        trim_deadline:
          type: integer
        trimmed_block:
          type: integer

    NodeOutpoint:
      type: object
      description: Outpoint shape matching quai_getOutpointsByAddress
      required: [txHash, index, denomination, lock]
      properties:
        txHash:
          type: string
        index:
          type: string
          description: Hex-encoded uint32
        denomination:
          type: string
          description: Hex-encoded uint8
        lock:
          type: string
          description: Hex-encoded lock height (0x0 = spendable)

    BalanceSummary:
      type: object
      properties:
        spendable:
          type: string
          description: Decimal qit
        locked:
          type: string
          description: Decimal qit
        trimmed:
          type: string
          description: Decimal qit
        spendable_count:
          type: integer
        locked_count:
          type: integer
        trimmed_count:
          type: integer

    HistoryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UTXO'
        next_cursor:
          type: string
          description: Pass as ?before= to fetch the next page; empty when no more results

    BlockUTXOEvents:
      type: object
      properties:
        created:
          type: array
          items:
            $ref: '#/components/schemas/UTXO'
        spent:
          type: array
          items:
            $ref: '#/components/schemas/UTXO'
        trimmed:
          type: array
          items:
            $ref: '#/components/schemas/UTXO'

    TxUTXOs:
      type: object
      properties:
        created:
          type: array
          items:
            $ref: '#/components/schemas/UTXO'
        spent:
          type: array
          items:
            $ref: '#/components/schemas/UTXO'

    Stats:
      type: object
      properties:
        tip_height:
          type: integer
        indexed_from:
          type: integer
        indexed_to:
          type: integer
        total_utxos:
          type: integer
        unspent_count:
          type: integer
        spent_count:
          type: integer
        trimmed_count:
          type: integer
        total_value:
          type: string
          description: Decimal qit sum of all unspent UTXOs

    Error:
      type: object
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
